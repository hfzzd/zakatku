[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "zakatku"
version = "0.2.0"
description = "Kalkulator zakat & infaq: zakat profesi, zakat mal, dan zakat fitrah"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Hafizd Ammar" }]

[project.scripts]
zakatku = "zakatku.cli:main"

[tool.setuptools.packages.find]
include = ["zakatku*"]
